# Alternative host: Render. "New > Blueprint" and pick this repo.
services:
  - type: web
    name: kidlog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kidlog-db
          property: connectionString
      # Google sign-in: Render asks for these when the blueprint is created.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Public https address of the site, and the contact address shown in the privacy policy.
      - key: PUBLIC_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      # Vaccine reminder emails (optional). Render has no built-in daily job: call /cron/vaccine-reminders once a day
      # from a Render Cron Job with the header "Authorization: Bearer <CRON_SECRET>".
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
databases:
  - name: kidlog-db
    plan: free
