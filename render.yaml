# Alternative host: Render. "New > Blueprint" and pick this repo.
services:
  - type: web
    name: kidlog
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kidlog-db
          property: connectionString
      # Google sign-in: Render asks for these when the blueprint is created.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
databases:
  - name: kidlog-db
    plan: free
